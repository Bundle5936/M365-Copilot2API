name: CI

on:
  push:
    branches:
      - uixb-v0.7.0-enhancements
  pull_request:
    branches:
      - uixb-v0.7.0-enhancements

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go tests and container build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run all Go tests
        run: go test ./...

      - name: Build the container
        run: docker build --tag m365-copilot2api:ci .

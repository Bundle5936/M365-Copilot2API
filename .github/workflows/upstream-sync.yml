name: Sync upstream release

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream release tag to sync, for example v0.8.0; blank means latest release"
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  TARGET_BRANCH: uixb-v0.7.0-enhancements
  UPSTREAM_REPOSITORY: HEXUXIU/M365-Copilot2API

jobs:
  sync:
    name: Test and merge latest upstream release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the maintained branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve and merge upstream release
        id: merge
        env:
          REQUESTED_REF: ${{ inputs.upstream_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch upstream --tags --force --prune

          upstream_ref="${REQUESTED_REF:-}"
          if [ -z "$upstream_ref" ]; then
            upstream_ref="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/latest" --jq '.tag_name')"
          fi
          if [ -z "$upstream_ref" ] || [ "$upstream_ref" = "null" ]; then
            echo "Unable to resolve an upstream release tag" >&2
            exit 1
          fi
          if ! git rev-parse --verify "refs/tags/${upstream_ref}^{commit}" >/dev/null 2>&1; then
            echo "Upstream release tag not found: ${upstream_ref}" >&2
            exit 1
          fi

          echo "upstream_ref=${upstream_ref}" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$(git rev-parse "refs/tags/${upstream_ref}^{commit}")" >> "$GITHUB_OUTPUT"
          echo "Upstream release: ${upstream_ref}"

          if git merge-base --is-ancestor "refs/tags/${upstream_ref}^{commit}" HEAD; then
            echo "already_current=true" >> "$GITHUB_OUTPUT"
            echo "The maintained branch already contains ${upstream_ref}"
            exit 0
          fi
          echo "already_current=false" >> "$GITHUB_OUTPUT"

          if git merge --no-commit --no-ff "refs/tags/${upstream_ref}"; then
            echo "merge_status=clean" >> "$GITHUB_OUTPUT"
            echo "Upstream merge has no textual conflicts"
          else
            conflict_files="$(git diff --name-only --diff-filter=U | sort)"
            if [ -z "$conflict_files" ]; then
              conflict_files="(merge failed without a normal unmerged-file list; inspect the workflow log)"
            fi
            git merge --abort || git reset --hard HEAD
            body_file="$(mktemp)"
            cat > "$body_file" <<EOF
          ## Upstream sync conflict

          The maintained branch \\`${TARGET_BRANCH}\\` cannot merge upstream release \\`${upstream_ref}\\` automatically.

          Upstream commit: \\`$(git rev-parse "refs/tags/${upstream_ref}^{commit}")\\`

          Conflicting files:
          \\`\\`\\`
          ${conflict_files}
          \\`\\`\\`

          Please ask the LXC Pi assistant to inspect and resolve this release. The branch and production deployment were not changed.
          EOF
            existing="$(gh issue list --state open --search "[upstream-sync] ${upstream_ref} in:title" --json number --jq 'length')"
            if [ "$existing" = "0" ]; then
              gh issue create \
                --title "[upstream-sync] Resolve conflicts for ${upstream_ref}" \
                --body-file "$body_file"
            else
              echo "An open conflict issue already exists for ${upstream_ref}"
            fi
            rm -f "$body_file"
            echo "merge_status=conflict" >> "$GITHUB_OUTPUT"
            exit 10
          fi

      - name: Stop when the branch is already current
        if: steps.merge.outputs.already_current == 'true'
        run: echo "Nothing to do"

      - name: Run the full test suite on the merged tree
        if: steps.merge.outputs.merge_status == 'clean'
        run: go test ./...

      - name: Validate the merged container
        if: steps.merge.outputs.merge_status == 'clean'
        run: docker build --tag m365-copilot2api:upstream-sync .

      - name: Commit the tested merge
        if: steps.merge.outputs.merge_status == 'clean'
        env:
          UPSTREAM_REF: ${{ steps.merge.outputs.upstream_ref }}
        run: |
          git commit -m "chore(sync): merge upstream ${UPSTREAM_REF}"
          git push origin "HEAD:${TARGET_BRANCH}"

name: Publish container image

on:
  push:
    branches:
      - uixb-v0.7.0-enhancements
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/bundle5936/m365-copilot2api

jobs:
  publish:
    name: Build and publish multi-architecture image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=M365-Copilot2API
            org.opencontainers.image.description=Microsoft 365 Copilot OpenAI and Anthropic compatible gateway
            org.opencontainers.image.source=https://github.com/Bundle5936/M365-Copilot2API

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
